name: snakes_ladders
description: Snakes and Ladders (Saanp Seedhi) with animated dice, themes, vs-computer and pass-and-play. Works offline.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../../packages/app_core
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_database: ^12.6.0
  flutter_webrtc: ^1.6.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
