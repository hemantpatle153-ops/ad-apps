name: doc_scanner
description: Scan documents to PDF on the phone, then share them.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../../packages/app_core
  image_picker: any
  pdf: any
  path_provider: any
  open_filex: any
  share_plus: ^13.3.1
  syncfusion_flutter_pdf: ^35.1.37
  printing: ^5.15.1
  google_mlkit_text_recognition: ^0.17.1
  file_picker: ^13.1.0
  image: ^4.10.1
  archive: ^4.3.0
  camera: ^0.12.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
