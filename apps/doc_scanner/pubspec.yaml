name: doc_scanner
description: Scan documents to PDF on the phone, then share them.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../../packages/app_core
  google_mlkit_document_scanner: any
  image_picker: any
  pdf: any
  path_provider: any
  open_filex: any
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
