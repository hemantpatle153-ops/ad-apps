name: video_player_app
description: Free video player with folders, gestures, subtitles, background audio and picture-in-picture. Works offline.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../../packages/app_core
  audio_service: ^0.18.19
  crypto: ^3.0.7
  file_picker: ^13.1.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  flutter_volume_controller: ^2.0.2
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  screen_brightness: ^2.1.11
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
