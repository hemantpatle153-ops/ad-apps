name: vacancy_bell
description: Government job alerts with eligibility check, last-date reminders and offline reading. Hindi and English.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_core:
    path: ../../packages/app_core
  http: ^1.2.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  share_plus: ^13.3.1
  flutter_local_notifications: any
  timezone: any
  workmanager: any
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_database: ^12.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
