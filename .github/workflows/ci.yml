name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/app_core
          - apps/qr_scanner
          - apps/daily_sudoku
          - apps/doc_scanner
          - apps/expense_tracker
          - apps/water_habit
          - apps/snakes_ladders
          - apps/video_player
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Test
        run: if [ -d test ]; then flutter test; fi
