name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/app_core
          - apps/qr_scanner
          - apps/daily_sudoku
          - apps/doc_scanner
          - apps/expense_tracker
          - apps/water_habit
          - apps/snakes_ladders
          - apps/multi_speaker
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Test
        run: if [ -d test ]; then flutter test; fi

  # Builds the Multi Speaker APK so it can be shared without a laptop
  # build. Signed with debug keys: the Play upload key stays offline.
  apk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [multi_speaker]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Private-repo runners have 7 GB of RAM; the template's 8 GB Gradle
      # heap gets the runner killed mid-build.
      - name: Fit Gradle in the runner's memory
        run: sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m/' android/gradle.properties
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
