name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/app_core
          - apps/qr_scanner
          - apps/daily_sudoku
          - apps/doc_scanner
          - apps/expense_tracker
          - apps/water_habit
          - apps/snakes_ladders
          - apps/multi_speaker
          - apps/video_player
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Test
        # Failing tests are also posted as annotations, readable without
        # downloading the full log.
        run: |
          [ -d test ] || exit 0
          set +e
          flutter test -r expanded 2>&1 | tee "$RUNNER_TEMP/test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '\[E\]$|Expected:|Actual:|Which:|Error:|Exception' "$RUNNER_TEMP/test.log" \
              | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

  # Builds test APKs so they can be shared without a laptop build. Signed
  # with debug keys: the Play upload key stays offline. To build another
  # app, add its folder name to the matrix. Each APK is also saved as the
  # only file on branch apk-<app> (replaced on every build), which is easy
  # to fetch with plain git.
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        app: [multi_speaker, video_player]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Private-repo runners have 7 GB of RAM; the template's 8 GB Gradle
      # heap gets the runner killed mid-build.
      - name: Fit Gradle in the runner's memory
        run: sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m/' android/gradle.properties
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Save the APK on a branch
        # Main's build goes to apk-<app>; a PR's to apk-<app>-pr<number>, so
        # parallel PRs don't overwrite each other or main. Forked PRs get a
        # read-only token; skip there.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          APP: ${{ matrix.app }}
          PR: ${{ github.event.pull_request.number }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="apk-$APP${PR:+-pr$PR}"
          out="$RUNNER_TEMP/apk-branch"
          mkdir -p "$out"
          apk=build/app/outputs/flutter-apk/app-release.apk
          # GitHub refuses files over 100 MB. Fall back to a 64-bit ARM only
          # APK, which nearly every phone since 2017 runs.
          if [ "$(stat -c %s "$apk")" -gt 95000000 ]; then
            flutter build apk --release --target-platform android-arm64
          fi
          echo "::notice::$APP APK is $(stat -c %s "$apk") bytes, saved on $branch"
          cp "$apk" "$out/$APP.apk"
          cd "$out"
          git init -q -b "$branch"
          git add "$APP.apk"
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -qm "$APP test APK from $GITHUB_SHA ($GITHUB_REF_NAME)"
          for try in 1 2 3; do
            if git push -qf "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" "$branch" 2> push.err; then
              exit 0
            fi
            echo "::warning::push try $try: $(tr '\n' ' ' < push.err | cut -c1-300)"
            sleep $((try * 15))
          done
          exit 1
