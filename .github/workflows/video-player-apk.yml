name: Video Player APK

# Builds a test APK of apps/video_player on GitHub, so it can be shared
# without a laptop build. Debug-signed with Google's test ads: the Play
# upload key stays offline.
on:
  pull_request:
    paths: ["apps/video_player/**", "packages/app_core/**", ".github/workflows/video-player-apk.yml"]
  push:
    branches: [main]
    paths: ["apps/video_player/**", "packages/app_core/**", ".github/workflows/video-player-apk.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/video_player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Private-repo runners have 7 GB of RAM; the template's 8 GB Gradle
      # heap gets the runner killed mid-build.
      - name: Fit Gradle in the runner's memory
        run: sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m/' android/gradle.properties
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: video-player
          path: |
            apps/video_player/build/app/outputs/flutter-apk/app-release.apk
            apps/video_player/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
