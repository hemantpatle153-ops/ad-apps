name: Firebase rules

# Runs the database rules tests on the local emulator when the rules change.
on:
  pull_request:
    paths: [firebase/**, .github/workflows/firebase-rules.yml]
  push:
    branches: [main]
    paths: [firebase/**]

jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
