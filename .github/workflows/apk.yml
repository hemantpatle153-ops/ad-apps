name: Test APKs

# Builds shareable test APKs on GitHub so a laptop isn't needed. They are
# signed with the runner's debug key: the Play upload keys stay offline, so
# installing one over a laptop-built copy needs an uninstall first.
on:
  push:
    branches: [main]
    paths: [apps/**, packages/**, .github/workflows/apk.yml]
  pull_request:
    paths: [.github/workflows/apk.yml]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - qr_scanner
          - daily_sudoku
          - doc_scanner
          - expense_tracker
          - water_habit
          - snakes_ladders
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Private-repo runners have 7 GB of RAM; the template's 8 GB Gradle
      # heap gets the runner killed mid-build.
      - name: Fit Gradle in the runner's memory
        run: sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m/' android/gradle.properties
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      # Also keep the APK as the only file on branch apk-<app> (replaced on
      # every build), which is easy to fetch with plain git.
      - name: Save the APK on branch apk-${{ matrix.app }}
        # Forked PRs get a read-only token; skip there.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          APP: ${{ matrix.app }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/apk-branch"
          mkdir -p "$out"
          cp build/app/outputs/flutter-apk/app-release.apk "$out/$APP.apk"
          cd "$out"
          git init -q -b "apk-$APP"
          git add "$APP.apk"
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -qm "$APP test APK from $GITHUB_SHA ($GITHUB_REF_NAME)"
          git push -qf "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" "apk-$APP"
